name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto KEYSTORE_BASE64: se compila sin publicar release."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PbuildNumber=${{ github.run_number }} \
            -PupdateRepo=${{ github.repository }}
          cp app/build/outputs/apk/release/app-release.apk "arbitraje-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: arbitraje-apk
          path: arbitraje-*.apk

      # La app busca el último release y se actualiza sola.
      - name: Publicar release
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" arbitraje-*.apk \
            --title "Arbitraje 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
